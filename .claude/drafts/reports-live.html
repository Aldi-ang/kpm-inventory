<title>KPM Reports</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* layout: KPM v5 master-detail (Receivables look, his "keep this UI" 2026-11-18) - one dense KPI strip, ledger left, receipt in hand right; phone opens under its row */
:root{
  --ground:#D6CEBA;--panel:#E3DCCB;--raised:#EAE4D6;--inset:#DCD4C1;--line:#B8AF9C;--line-2:#9F9785;--hair:rgba(19,18,17,.10);
  --ink:#131211;--ink-muted:#3A3733;--ink-dim:#5E584F;--gold:#8A5A12;--accent-ink:#5A3B05;--accent-edge:#8A6420;--danger-ink:#7A2118;
  --page:#C9C0AA;--sel:rgba(138,90,18,.09);--wash:rgba(138,90,18,.13);--scrim:rgba(19,18,17,.38);
  --paper:#FBF9F4;--paper-ink:#1A1A1A;--receipt:#1E4C8F;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B0A09;--panel:#121110;--raised:#171513;--inset:#0E0D0C;--line:#24211D;--line-2:#3A3631;--hair:rgba(232,228,222,.06);
  --ink:#ECE7E0;--ink-muted:#A9A196;--ink-dim:#7C756C;--gold:#D08A2E;--accent-ink:#E0A04A;--accent-edge:#9C6924;--danger-ink:#E7907F;
  --page:#050504;--sel:rgba(208,138,46,.07);--wash:rgba(208,138,46,.12);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0B0A09;--panel:#121110;--raised:#171513;--inset:#0E0D0C;--line:#24211D;--line-2:#3A3631;--hair:rgba(232,228,222,.06);
  --ink:#ECE7E0;--ink-muted:#A9A196;--ink-dim:#7C756C;--gold:#D08A2E;--accent-ink:#E0A04A;--accent-edge:#9C6924;--danger-ink:#E7907F;
  --page:#050504;--sel:rgba(208,138,46,.07);--wash:rgba(208,138,46,.12);--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.board{max-width:1180px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:12.5px;color:var(--ink-muted)}
.board h1{font-size:13px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12px;color:var(--ink-dim)}
.seg button[aria-pressed="true"]{background:var(--wash);color:var(--ink);font-weight:600}
.cap{max-width:1180px;margin:22px auto 10px;color:var(--ink-dim);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}

.frame{background:var(--ground);border:1px solid var(--line-2);margin:0 auto;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 18px 40px -24px rgba(0,0,0,.55)}
.frame.pc{max-width:1180px;height:780px}
.frame.phone{width:390px;max-width:100%;height:840px;border-radius:24px}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--accent-edge);
  background:transparent;color:var(--ink);font-weight:600;font-size:12.5px;border-radius:8px;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--sel)}
.btn.quiet{border-color:var(--line-2);color:var(--ink-muted)}
.btn.danger{border-color:var(--line-2);color:var(--danger-ink)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.xs{height:26px;padding:0 8px;font-size:11.5px}

.hd{display:flex;align-items:center;gap:10px;padding:14px 20px 0;flex-wrap:wrap}
.hd h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;margin-right:6px}
.hd .sub{font-size:12px;color:var(--ink-dim);margin-right:auto}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{height:32px;border:1px solid var(--line-2);border-radius:8px;background:var(--inset);padding:0 10px;font-size:12.5px;color:var(--ink)}
.search{display:flex;align-items:center;gap:6px;height:32px;border:1px solid var(--line-2);border-radius:8px;background:var(--inset);padding:0 10px;color:var(--ink-dim);min-width:0}
.search input{border:0;background:transparent;outline:0;width:150px;font-size:12.5px;color:var(--ink)}
.per{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;height:32px}
.per button{border:0;background:transparent;padding:0 10px;font-size:12.5px;color:var(--ink-dim)}
.per button[aria-pressed="true"]{background:var(--wash);color:var(--ink);font-weight:600}

.kpi{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1.6fr;margin:12px 20px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.k{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.k:last-child{border-right:0}
.k .l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-dim);font-weight:600;display:flex;justify-content:space-between;gap:6px}
.k .v{font-size:19px;font-weight:700;letter-spacing:-.015em;margin-top:2px;white-space:nowrap}
.k .v.sm{font-size:16px}
.k .d{font-size:11.5px;color:var(--ink-dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d .up{color:var(--accent-ink);font-weight:600}.d .dn{color:var(--danger-ink);font-weight:600}
.spark{display:block;width:100%;height:26px;margin-top:4px}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 6px;background:var(--inset)}
.mix span{height:100%;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.mixl{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--ink-muted)}
.mixl i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}
.c-cash{background:var(--ink-muted)}.c-tf{background:var(--line-2)}.c-qr{background:var(--ink-dim)}.c-ti{background:var(--gold)}

.part{margin:8px 20px 0;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 12px;border:1px dashed var(--accent-edge);border-radius:8px;font-size:12px;color:var(--ink-muted);flex-wrap:wrap}

.tabs{display:flex;gap:20px;padding:0 20px;border-bottom:1px solid var(--line);margin-top:10px;overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 0 10px;border-bottom:2px solid transparent;font-size:13px;font-weight:600;color:var(--ink-dim);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--gold)}
.tab .n{font-weight:500;color:var(--ink-dim);margin-left:4px}

.work{flex:1;display:flex;min-height:0}
.list{width:470px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0}
.rows{flex:1;overflow:auto;min-height:0}
.day{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;padding:7px 16px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim);background:var(--inset);border-bottom:1px solid var(--line)}
.r{display:grid;grid-template-columns:42px minmax(0,1fr) 62px 74px 100px;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 16px;border:0;border-bottom:1px solid var(--hair);background:transparent;text-align:left}
.r:hover{background:var(--sel)}
.r.sel{background:var(--wash)}
.r .t{font-size:12px;color:var(--ink-dim)}
.r .sh{min-width:0}
.r .sh b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .sh span{display:block;font-size:11.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .ag{font-size:12px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .am{text-align:right;font-weight:600;font-size:13px;white-space:nowrap}
.r .am.neg{color:var(--danger-ink)}.r .am.zero{color:var(--ink-dim)}
.chip{justify-self:start;font-size:10px;font-weight:600;letter-spacing:.03em;padding:2px 6px;border-radius:5px;border:1px solid var(--line-2);color:var(--ink-muted);white-space:nowrap}
.chip.ti{border-color:var(--accent-edge);color:var(--accent-ink)}
.chip.rt{border-color:var(--danger-ink);color:var(--danger-ink)}
.pk{font-size:10px;font-weight:700;color:var(--accent-ink);letter-spacing:.04em;margin-left:4px}
.more{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-dim)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-dim);font-size:13px}

.hand{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--ground)}
.hand .in{flex:1;padding:20px 26px;display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0}
.fade{animation:fadeUp .24s cubic-bezier(.2,.7,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-start;gap:12px}
.ph .av{width:42px;height:42px;border-radius:10px;background:var(--raised);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent-ink);flex:none}
.ph h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.ph p{margin:2px 0 0;font-size:12px;color:var(--ink-dim)}
.ph .tot{margin-left:auto;text-align:right}
.ph .tot .l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
.ph .tot .v{font-size:20px;font-weight:700;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.facts div{padding:8px 12px;border-right:1px solid var(--line);min-width:0}
.facts div:nth-child(4n){border-right:0}
.facts div:nth-child(n+5){border-top:1px solid var(--line)}
.facts .l{font-size:10.5px;color:var(--ink-dim);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.facts .v{font-size:13px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-muted);margin-top:6px}
.resp b{color:var(--ink)}
.tblw{overflow-x:auto}
table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
th{background:var(--inset);text-align:left;font-size:10.5px;font-weight:600;color:var(--ink-dim);letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--hair);font-size:13px}
tr:last-child td{border-bottom:none}
.num{text-align:right;white-space:nowrap}
tfoot td{background:var(--inset);font-weight:700;border-top:1px solid var(--line)}
.act{display:flex;align-items:center;gap:8px;padding:12px 26px;border-top:1px solid var(--line);flex-wrap:wrap}
.act .sp{flex:1}
.lock{font-size:11.5px;color:var(--ink-dim)}
.note{margin:0;font-size:13px;color:var(--ink-muted)}

.pane{flex:1;overflow:auto;padding:16px 20px;min-height:0;display:flex;flex-direction:column;gap:14px}
.sec{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-dim);display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--inset);overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;background:var(--gold);width:0;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.rowbtn{cursor:pointer}
.rowbtn:hover td{background:var(--sel)}
.hint{font-size:12px;color:var(--ink-dim);margin:0}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;color:var(--ink-dim)}
.crumb button{border:0;background:transparent;padding:2px 4px;border-radius:4px;color:var(--ink-muted);font-size:12px}
.crumb button:hover{background:var(--sel)}
.crumb b{color:var(--ink);padding:2px 4px}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fold{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:left;width:100%}
.fold:hover{border-color:var(--accent-edge);background:var(--sel)}
.fold .fi{width:34px;height:34px;border-radius:8px;background:var(--inset);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-dim);flex:none}
.fold b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold span{display:block;font-size:11.5px;color:var(--ink-dim)}
.fold .fv{margin-left:auto;font-weight:700;font-size:13px;white-space:nowrap}
.sub-row td{background:var(--inset);font-size:12px;color:var(--ink-muted)}
.flag{color:var(--danger-ink);font-weight:600}

.roll{display:inline-flex;align-items:baseline;line-height:1.15;white-space:pre}
.reel{display:inline-block;height:1.15em;overflow:hidden;vertical-align:bottom}
.reel > span{display:flex;flex-direction:column;transition:transform .65s cubic-bezier(.2,.7,.2,1)}
.reel > span > span{height:1.15em}

.ov{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;animation:fi .16s}
@keyframes fi{from{opacity:0}}
.dlg{background:var(--raised);border:1px solid var(--line-2);border-radius:12px;width:min(460px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 50px -20px rgba(0,0,0,.6);animation:fadeUp .2s}
.dlg h4{margin:0;font-size:15px}
.dlg p{margin:0;font-size:13px;color:var(--ink-muted)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim)}
.dlg .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eline{display:grid;grid-template-columns:minmax(0,1fr) 76px 92px 28px;gap:6px;align-items:center;font-size:12.5px}
.eline select,.eline input{height:30px;border:1px solid var(--line-2);border-radius:7px;background:var(--inset);padding:0 6px;min-width:0;font-size:12.5px}
.eline input{text-align:right}
.x{border:1px solid var(--line-2);background:transparent;border-radius:7px;height:30px;color:var(--danger-ink)}
.gt{display:flex;justify-content:space-between;font-weight:700;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:14px 16px;font-size:12.5px}
.paper .rh{background:var(--receipt);color:#fff;margin:-14px -16px 10px;padding:10px 16px;border-radius:8px 8px 0 0;font-weight:700;letter-spacing:.04em}
.paper table{border:0;background:transparent}
.paper td{background:transparent;color:var(--paper-ink);border-bottom:1px dashed #c9c4b8;padding:5px 0;font-size:12px}
.paper .gt{border-color:#c9c4b8}
.photo{border-radius:8px;overflow:hidden;border:1px solid var(--line-2)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;background:var(--raised);border:1px solid var(--accent-edge);border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.6);transition:opacity .2s,transform .25s cubic-bezier(.2,.7,.2,1);z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:18px;height:18px;flex:none;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.toast path{stroke-dasharray:24;stroke-dashoffset:24}
.toast.on path{animation:draw .45s .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.phone .hd{padding:12px 14px 0}
.phone .hd .sub{width:100%;order:3;margin:0}
.phone .ctl{width:100%}
.phone .search{flex:1}.phone .search input{width:100%}
.phone .kpi{grid-template-columns:1fr 1fr;margin:10px 14px 0}
.phone .k{border-bottom:1px solid var(--line)}
.phone .k:nth-child(2n){border-right:0}
.phone .k.mixk{grid-column:1/-1;border-bottom:0}
.phone .k .v{font-size:16px}
.phone .part{margin:8px 14px 0}
.phone .tabs{padding:0 14px;gap:16px}
.phone .list{width:100%;border-right:0}
.phone .hand{display:none}
.phone .r{grid-template-columns:38px minmax(0,1fr) 92px;padding:7px 14px}
.phone .r .ag,.phone .r .chip{display:none}
.phone .under{background:var(--raised);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;animation:fadeUp .22s}
.phone .facts{grid-template-columns:1fr 1fr}
.phone .facts div:nth-child(2n){border-right:0}
.phone .facts div:nth-child(n+3){border-top:1px solid var(--line)}
.phone .pane{padding:12px 14px}
.phone .hide-ph{display:none}
.phone .folders{grid-template-columns:1fr}
.sb{height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:11px;color:var(--ink-dim);flex:none}

@media (max-width:760px){.frame.pc{display:none}.pcap{display:none}}
.nomotion *,.nomotion *::before,.nomotion *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="board">
  <h1>Reports · playable picture</h1>
  <span>View as <span class="seg" id="role"><button aria-pressed="true" data-v="global">Owner (all)</button><button aria-pressed="false" data-v="regional">Regional · Hendra, Bandung</button><button aria-pressed="false" data-v="personal">Salesman · Agus</button></span></span>
  <span>Theme <span class="seg" id="theme"><button aria-pressed="true" data-v="">System</button><button aria-pressed="false" data-v="light">Light</button><button aria-pressed="false" data-v="dark">Dark</button></span></span>
  <span>Motion <span class="seg" id="motion"><button aria-pressed="true" data-v="on">On</button><button aria-pressed="false" data-v="off">Lite</button></span></span>
  <span style="flex-basis:100%">Shops, salesmen and products are the demo company's. Every amount is an <b>example</b>, worked out from the lines of each receipt. Omset only: the app keeps no cost price, so there is no profit figure.</span>
</div>

<p class="cap pcap">PC · 1180 px</p>
<div class="frame pc" id="pc"></div>
<p class="cap">Phone · 390 px</p>
<div class="frame phone" id="ph"></div>

<div class="toast" id="toast" role="status" aria-live="polite"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="toastT"></span></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h4"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M14 4l6 6-10 10H4v-6z"/></symbol>

      <div class="mixl">${MIX.map(([k, c]) => `<span><i class="${c}"></i>${k} ${Math.round((v.now.mix[k] || 0) / (mixTot || 1) * 100)}%</span>`).join('')}</div></div>
  </div>
  ${v.partial ? `<div class="part"><span>Showing the last 7 days. This ${RANGE[st.range]} starts on ${short(v.w[0])}.</span>${G.role !== 'personal' ? `<button class="btn xs" data-act="archive"><svg class="i"><use href="#i-arch"/></svg>Pull archive</button>` : '<span>Ask an admin for older receipts.</span>'}</div>` : ''}
  <div class="tabs" role="tablist">${tabs.map(([k, l, n]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${st.tab === k}">${l}${n !== '' ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</div>`;

    html += `<div class="work"><aside class="list"><div class="rows">`;

      html += `<button class="r ${sel ? 'sel' : ''}" data-row="${t.id}"><span class="t">${t.time}</span><span class="sh"><b>${esc(t.shop)}${t.offer ? '<span class="pk">PAKET</span>' : ''}</b><span>${ph ? A[t.agent].short + ' · ' + kindOf(t) : esc(t.area)}</span></span>

      if (ph && st.openPhone === t.id) html += `<div class="under">${detail(t, st, true)}</div>`;

    } else {
      const store = st.path[st.path.length - 1], acct = rs.reduce((s, t) => s + omsetOf(t), 0);
      html += `<div class="sec"><span>Receipt archive · ${esc(store)}</span><span>Account total ${rp(acct)}</span></div>
        <div class="tblw"><table><thead><tr><th>Date</th><th>Type</th><th class="hide-ph">Items</th><th class="num">Amount</th><th></th></tr></thead><tbody>
        ${rs.map((t) => `<tr class="rowbtn" data-goto="${t.id}"><td>${short(t.date)} ${t.time}</td><td>${kindOf(t)}${t.offer ? ' <span class="pk">PAKET</span>' : ''}</td><td class="hide-ph">${t.items.map((it) => it.qty + '× ' + prod(it.p).name).join(', ') || '—'}</td><td class="num">${rp(total(t))}</td><td class="num">›</td></tr>`).join('')}
        </tbody></table></div>
        ${isAdmin() ? `<div><button class="btn danger sm" data-act="delstore" data-store="${esc(store)}"><svg class="i"><use href="#i-trash"/></svg>Delete all history for this shop</button></div>` : ''}`;
    }
    html += `</div>`;
  } else if (st.tab === 'products') {
    html += `<div class="pane"><div class="sec"><span>Product performance</span><span>tap a row to see its receipts</span></div><div class="tblw"><table><thead><tr><th>Product</th><th class="num">Moved</th><th class="num hide-ph">Shops</th><th class="num">Omset</th><th class="hide-ph">Share</th></tr></thead><tbody>
      ${prodRows.map((x) => `<tr class="rowbtn" data-prod="${esc(x.p.name)}"><td><b>${esc(x.p.name)}</b></td><td class="num">${x.q.toLocaleString('id-ID')} ${x.p.slop ? 'Slop' : 'Bks'}</td><td class="num hide-ph">${x.shops}</td><td class="num">${rp(x.om)}</td>
        <td class="hide-ph" style="width:24%"><div class="bar"><span ${W((x.om / maxP * 100).toFixed(1) + '%')}></span></div></td></tr>`).join('') || '<tr><td colspan="5">No sales in this range.</td></tr>'}

      ${returns.map((t) => `<tr class="rowbtn" data-goto="${t.id}"><td>${short(t.date)}</td><td><b>${esc(t.shop)}</b>${pkgFlag(t) ? ' <span class="flag">· package ≤7 days</span>' : ''}</td><td class="hide-ph">${A[t.agent].short}</td><td>${t.items.map((it) => it.qty + '× ' + prod(it.p).name).join(', ')}</td><td class="num" style="color:var(--danger-ink)">${rp(total(t))}</td></tr>`).join('') || '<tr><td colspan="5">No returns in this range. Clean.</td></tr>'}

      <div class="tblw"><table><tbody>${CLEARS.map((c) => `<tr><td><b>${c.shop}</b></td><td>${short(c.date)}</td><td class="num">by ${c.by}</td></tr>`).join('')}</tbody></table></div>` : ''}</div>`;
  }
  html += `</div>`;
  if (st.modal) html += st.modal();
  el.innerHTML = html;
  const sc = el.querySelector('.rows, .pane'); if (sc) sc.scrollTop = scroll;
  settleRolls(el); st.grown = true;

function detail(t, st, ph) {
  const tot = total(t), a = A[t.agent];
  const head = `<div class="ph"><div class="av">${ini(t.shop)}</div><div style="min-width:0"><h3>${esc(t.shop)}</h3><p>${esc(t.kec)}, ${esc(t.kab)} · ${t.region}</p>
    <span class="resp">Salesman <b>${a.name}</b></span></div><div class="tot"><div class="l">${t.type === 'SETTLE' ? 'Paid on notes' : t.type === 'RETUR' ? 'Refund' : 'Receipt total'}</div><div class="v">${R(st, 'det' + (ph ? 'p' : ''), rp(tot))}</div></div></div>`;
  const facts = `<div class="facts">
    <div><div class="l">When</div><div class="v">${short(t.date)}, ${t.time}</div></div>
    <div><div class="l">${t.type === 'RETUR' ? 'Condition' : 'Payment'}</div><div class="v">${t.pay}</div></div>
    <div><div class="l">Moved</div><div class="v">${t.items.length ? bks(t) + ' Bks' : '—'}</div></div>
    <div><div class="l">Price tier</div><div class="v">${t.tier}</div></div>
    ${ph ? '' : `<div><div class="l">GPS</div><div class="v">Verified · 38 m</div></div><div><div class="l">Proof photo</div><div class="v">Attached</div></div><div><div class="l">Offer</div><div class="v">${t.offer || '—'}</div></div><div><div class="l">Receipt no.</div><div class="v">KPM-${t.date.slice(2).replace(/-/g, '')}-${t.id.slice(1)}</div></div>`}
  </div>`;
  const note = t.type === 'EXCHANGE' ? '<p class="note">Tukar Ganti: damaged packs swapped for good ones. Goods move, money does not.</p>'
    : t.type === 'IOU' ? '<p class="note">IOU fulfilment: goods the shop had already paid for, delivered now. Counted when it was paid.</p>' : '';
  const lines = t.items.length ? `<div class="tblw"><table><thead><tr><th>Product</th><th class="num">Qty</th>${ph ? '' : '<th class="num">Price</th>'}<th class="num">Subtotal</th></tr></thead><tbody>
    ${t.items.map((it) => { const p = prod(it.p); return `<tr><td>${esc(p.name)}</td><td class="num">${it.qty} ${p.slop ? 'Slop' : 'Bks'}</td>${ph ? '' : `<td class="num">${rp(it.price)}</td>`}<td class="num">${rp(it.qty * it.price * (t.type === 'RETUR' ? -1 : 1))}</td></tr>`; }).join('')}
    </tbody><tfoot><tr><td colspan="${ph ? 2 : 3}">Total</td><td class="num">${rp(tot)}</td></tr></tfoot></table></div>`
    : `<p class="note">Cash collected against this shop's consignment notes. It lowers what the shop owes and is not new omset.</p>`;
  return head + facts + note + lines + (ph ? `<div style="display:flex;gap:6px;flex-wrap:wrap">${actions(t, true)}</div>` : '');
}
function actions(t, ph) {
  const s = ph ? ' sm' : '';
  let h = `<button class="btn quiet${s}" data-act="receipt" data-id="${t.id}"><svg class="i"><use href="#i-doc"/></svg>Receipt</button>
    <button class="btn quiet${s}" data-act="proof" data-id="${t.id}"><svg class="i"><use href="#i-cam"/></svg>Proof</button>`;
  if (!ph) h += `<span class="sp"></span>`;
  if (isAdmin()) h += `${t.items.length && t.type === 'SALE' ? `<button class="btn${s}" data-act="edit" data-id="${t.id}"><svg class="i"><use href="#i-edit"/></svg>Edit</button>` : ''}
    <button class="btn danger${s}" data-act="delete" data-id="${t.id}"><svg class="i"><use href="#i-trash"/></svg>Delete</button>`;
  else h += `<span class="lock"><svg class="i" style="vertical-align:-3px;width:14px;height:14px"><use href="#i-lock"/></svg> Edit and delete need the vault open</span>`;
  return h;
}

/* ---------- events ---------- */
function rerenderAll() { apps.forEach((a) => render(a.el, a.st)); }
function refocus(el, id, st) { const i = el.querySelector('#' + id); if (i) { i.focus(); if (i.setSelectionRange && i.type !== 'number' && i.type !== 'date') i.setSelectionRange(i.value.length, i.value.length); } }
function onInput(e, el, st) {
  const tg = e.target, f = tg.dataset.f, ed = tg.dataset.e;
  if (ed && st.edit) {
    const i = +tg.dataset.i;
    if (ed === 'qty') { st.edit.items[i].qty = Math.max(0, parseInt(tg.value, 10) || 0);
      el.querySelector(`#e-s-${st.mode}-${i}`).textContent = rp(st.edit.items[i].qty * st.edit.items[i].price);
      el.querySelector(`#e-gt-${st.mode}`).textContent = rp(st.edit.items.reduce((s, it) => s + it.qty * it.price, 0)); return; }
    if (e.type !== 'change' && ed !== 'shop') return;
    if (ed === 'shop') { st.edit.shop = tg.value; return; }
    if (ed === 'date') st.edit.date = tg.value;
    if (ed === 'tier') { st.edit.tier = tg.value; st.edit.items.forEach((it) => { it.price = line(prod(it.p), it.qty, st.edit.tier).price; }); }
    if (ed === 'p') { st.edit.items[i].p = tg.value; st.edit.items[i].price = line(prod(tg.value), 1, st.edit.tier).price; }
    return render(el, st);
  }
  if (!f) return;
  if (f === 'q') { st.q = tg.value; render(el, st); return refocus(el, `q-${st.mode}`, st); }
  if (e.type !== 'change') return;
  if (f === 'date') { if (tg.value) st.date = tg.value > dayKey(TODAY) ? dayKey(TODAY) : tg.value; }
  if (f === 'region') { st.region = tg.value; st.agent = 'ALL'; }
  if (f === 'agent') st.agent = tg.value;
  if (f === 'scale') st.scale = +tg.value;
  render(el, st);
}
function onClick(e, el, st) {
  const b = e.target.closest('button, tr.rowbtn, .ov');
  if (!b) return;
  if (b.classList.contains('ov')) { if (e.target === b) { st.modal = null; st.edit = null; render(el, st); } return; }
  const d = b.dataset, t = TX.find((x) => x.id === d.id);
  if (d.range) { st.range = d.range; return render(el, st); }
  if (d.tab) { st.tab = d.tab; return render(el, st); }
  if (d.row) { if (st.mode === 'phone') st.openPhone = st.openPhone === d.row ? null : d.row; else st.sel = d.row; return render(el, st); }
  if (d.prod) { st.q = d.prod; st.tab = 'ledger'; st.sel = null; return render(el, st); }
  if (d.exp) { st.expanded = st.expanded === d.exp ? null : d.exp; return render(el, st); }
  if (d.agentgo) { st.agent = d.agentgo; if (G.role === 'global') st.region = A[d.agentgo].region; st.tab = 'ledger'; st.sel = null; return render(el, st); }
  if (d.goto) { st.tab = 'ledger'; st.sel = d.goto; st.openPhone = d.goto; return render(el, st); }
  if (d.drill !== undefined) { st.path.push(d.drill); return render(el, st); }
  if (d.crumb !== undefined) { st.path = st.path.slice(0, +d.crumb + 1); return render(el, st); }
  switch (d.act) {
    case 'close': st.modal = null; st.edit = null; return render(el, st);
    case 'receipt': st.modal = M.receipt(t); return render(el, st);
    case 'proof': st.modal = M.proof(t); return render(el, st);
    case 'delete': st.modal = M.del(t); return render(el, st);
    case 'edit': st.edit = { id: t.id, date: t.date, shop: t.shop, tier: t.tier, items: t.items.map((it) => ({ ...it })) }; st.modal = M.edit(st); return render(el, st);
    case 'eline-add': st.edit.items.push(line(P[0], 10, st.edit.tier)); return render(el, st);
    case 'eline-x': st.edit.items.splice(+d.i, 1); return render(el, st);
    case 'save': { const x = TX.find((y) => y.id === st.edit.id), items = st.edit.items.filter((it) => it.qty > 0);
      if (!items.length) return toast('A receipt needs at least one line. Use Delete to remove it.');
      Object.assign(x, { date: st.edit.date || x.date, shop: st.edit.shop.trim() || x.shop, tier: st.edit.tier, items });
      TX.sort((a, c) => (c.date + c.time).localeCompare(a.date + a.time)); st.modal = null; st.edit = null; rerenderAll(); return toast('Receipt saved, the month\'s figures updated'); }
    case 'share': { const txt = `KPM ${t.date} ${t.time} · ${t.shop} · ${t.items.map((it) => it.qty + 'x ' + prod(it.p).name).join(', ') || 'Pembayaran titip'} · ${rp(total(t))} (${t.pay})`;
      const done = () => toast('Receipt copied, ready to paste in WhatsApp'); try { navigator.clipboard.writeText(txt).then(done, done); } catch (_) { done(); }
      st.modal = null; return render(el, st); }
    case 'confirmdel': TX.splice(TX.indexOf(t), 1); st.modal = null; st.sel = null; st.openPhone = null; rerenderAll(); return toast('Receipt deleted, written to the audit log');
    case 'delstore': { const v = view(st), rs = v.rows.filter((x) => (x.shop === d.store) || (d.store === 'Individuals (Ecer)' && (x.shop === 'Walk-in buyer' || x.tier === 'Ecer')));
      st.modal = M.delstore(d.store, rs.length, rs.reduce((s, x) => s + omsetOf(x), 0)); return render(el, st); }
    case 'confirmdelstore': { const v = view(st), rs = v.rows.filter((x) => x.shop === d.store || (d.store === 'Individuals (Ecer)' && (x.shop === 'Walk-in buyer' || x.tier === 'Ecer')));
      rs.forEach((x) => TX.splice(TX.indexOf(x), 1)); st.modal = null; st.path.pop(); rerenderAll(); return toast(`${rs.length} records deleted for ${d.store}`); }
    case 'archive': apps.forEach((a) => { a.st.archive = true; }); rerenderAll(); return toast('Archive pulled: older receipts loaded for this range');
    case 'print': return toast(`In the app this opens the print view at ${st.scale}%`);
    case 'printr': return toast('In the app this sends the receipt to the Bluetooth printer');
  }
}

/* ---------- page controls ---------- */
const segs = (id, fn) => document.getElementById(id).addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return;
  b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); fn(b.dataset.v); });
segs('role', (v) => { G.role = v; apps.forEach((a) => { Object.assign(a.st, { agent: 'ALL', region: 'ALL', sel: null, openPhone: null, path: [], expanded: null, modal: null, edit: null });
  if (v === 'personal' && a.st.tab === 'salesmen') a.st.tab = 'ledger'; }); rerenderAll();
  toast(v === 'global' ? 'Owner: every region, edit and delete with the vault open' : v === 'regional' ? 'Hendra: only the BANDUNG region, no edit or delete' : 'Agus: only his own sales, no archive, no edit'); });
segs('theme', (v) => { if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; });
segs('motion', (v) => { G.motion = v === 'on'; document.body.classList.toggle('nomotion', !G.motion); });

mount(document.getElementById('pc'), 'pc');
mount(document.getElementById('ph'), 'phone');
apps[1].st.openPhone = apps[1].st.sel; render(apps[1].el, apps[1].st);
</script>
