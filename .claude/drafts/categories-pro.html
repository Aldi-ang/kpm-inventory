<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>KPM Master Vault · Categories &amp; Sub-categories</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Exact same Warm Stone / Espresso tokens & Inter font as customers-c.html and competitors-pro.html (Task 79.3 + Task 81 D-J). Zero blue, zero green, zero amber fill. */
:root{
  --ground:#D6CEBA;--panel:#E3DCCB;--raised:#EAE4D6;--inset:#DCD4C1;--line:#B8AF9C;--line-2:#9F9785;--hair:rgba(19,18,17,.10);
  --ink:#131211;--ink-muted:#3A3733;--ink-dim:#5E584F;--gold:#8A5A12;--accent-ink:#5A3B05;--accent-edge:#8A6420;--danger-ink:#7A2118;
  --page:#C9C0AA;--sel:rgba(138,90,18,.09);--wash:rgba(138,90,18,.15);--scrim:rgba(19,18,17,.46);
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B0A09;--panel:#121110;--raised:#171513;--inset:#0E0D0C;--line:#24211D;--line-2:#3A3631;--hair:rgba(232,228,222,.07);
  --ink:#ECE7E0;--ink-muted:#A9A196;--ink-dim:#7C756C;--gold:#D08A2E;--accent-ink:#E0A04A;--accent-edge:#9C6924;--danger-ink:#E7907F;
  --page:#050504;--sel:rgba(208,138,46,.08);--wash:rgba(208,138,46,.15);--scrim:rgba(0,0,0,.66);color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0B0A09;--panel:#121110;--raised:#171513;--inset:#0E0D0C;--line:#24211D;--line-2:#3A3631;--hair:rgba(232,228,222,.07);
  --ink:#ECE7E0;--ink-muted:#A9A196;--ink-dim:#7C756C;--gold:#D08A2E;--accent-ink:#E0A04A;--accent-edge:#9C6924;--danger-ink:#E7907F;
  --page:#050504;--sel:rgba(208,138,46,.08);--wash:rgba(208,138,46,.15);--scrim:rgba(0,0,0,.66);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:13px/1.44 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-2px}
.dim{color:var(--ink-dim)}

/* Top switcher board */
.board{max-width:1240px;margin:0 auto 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font-size:12.5px;color:var(--ink-muted)}
.board h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;padding:3px;gap:3px;background:var(--inset);flex-wrap:wrap}
.seg button{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:5px 10px;min-height:32px;font-size:12px;color:var(--ink-muted);font-weight:500;transition:background .12s,border-color .12s}
.seg button:hover{border-color:var(--line-2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--wash);border-color:var(--accent-edge);color:var(--ink);font-weight:700}
.cap{max-width:1240px;margin:22px auto 10px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}

/* Dual frames */
.fr{margin:0 auto;border:1px solid var(--line-2);border-radius:12px;background:var(--ground);overflow:hidden;position:relative;box-shadow:0 18px 40px -24px rgba(0,0,0,.55);display:flex;flex-direction:column}
.fr.pc{max-width:1240px;min-height:790px}
.fr.phone{width:390px;max-width:100%;height:844px;border-radius:24px}

/* Outlined buttons: min 36px PC / 44px phone, zero amber fill */
.btn{min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border-radius:8px;border:1px solid var(--accent-edge);background:var(--panel);color:var(--ink);font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .14s,border-color .14s,transform .1s}
.btn:hover{background:var(--wash)}
.btn:active{transform:scale(.98)}
.btn.q{border-color:var(--line-2);color:var(--ink)}
.btn.q:hover{background:var(--sel);border-color:var(--accent-edge)}
.btn.d{border-color:var(--danger-ink);color:var(--danger-ink)}
.btn.d:hover{background:color-mix(in srgb,var(--danger-ink) 12%,transparent)}
.btn.xs{min-height:36px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Searchable picker button + popover (Task 81 C: zero native select blue highlight) */
.pick-btn{min-height:38px;width:100%;border:1px solid var(--line-2);border-radius:8px;background:var(--inset);color:var(--ink);padding:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;transition:border-color .14s,background .14s}
.pick-btn:hover{border-color:var(--accent-edge);background:var(--sel)}
.pick-btn .pk-txt{min-width:0;flex:1}
.pick-btn .pk-name{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-btn .pk-sub{display:block;font-size:10.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-btn .pk-ic{display:inline-flex;align-items:center;gap:4px;color:var(--accent-ink);font-size:11px;font-weight:600;flex:none}
.search-box{min-height:38px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;display:flex;align-items:center;gap:8px;background:var(--inset);color:var(--ink-muted);width:100%}
.search-box:focus-within{border-color:var(--accent-edge)}
.search-box input{border:0;background:transparent;outline:0;color:var(--ink);flex:1;min-width:0;font-size:12.5px}
.pop-list{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:flex;flex-direction:column}
.pop-grp{padding:6px 11px;background:var(--inset);border-bottom:1px solid var(--line);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink)}
.pop-opt{width:100%;min-height:42px;border:0;border-bottom:1px solid var(--hair);background:transparent;padding:8px 12px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pop-opt:last-child{border-bottom:0}
.pop-opt:hover{background:var(--sel)}
.pop-opt.on{background:var(--wash);font-weight:700}
.pop-opt b{display:block;font-size:12.5px}
.pop-opt span{display:block;font-size:11px;color:var(--ink-dim)}

.inp{min-height:36px;border:1px solid var(--line-2);border-radius:8px;background:var(--inset);padding:0 10px;font-size:12.5px;color:var(--ink);outline:none;min-width:0;width:100%}
.inp:focus{border-color:var(--accent-edge)}
textarea.inp{min-height:66px;padding:8px 10px;resize:vertical}
select.inp option{background:var(--panel);color:var(--ink)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid var(--line-2);color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.st.g{border-color:var(--accent-edge);color:var(--accent-ink);background:var(--sel)}
.st.bad{border-color:var(--danger-ink);color:var(--danger-ink)}

/* Header & KPI strip */
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;flex:none}
.top .t{font-size:16px;font-weight:700}
.top .sub{font-size:11.5px;color:var(--ink-dim)}
.top .sp{flex:1}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.kpi > div{padding:9px 14px;border-right:1px solid var(--line);min-width:0}
.kpi > div:last-child{border-right:0}
.kpi .lbl{display:block;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-dim)}
.kpi .val{font-size:17px;font-weight:700}
.kpi i{font-style:normal;font-size:11px;color:var(--ink-dim);margin-left:6px}

/* Rolling digits */
.roll{display:inline-flex;align-items:baseline;line-height:1.15;white-space:pre}
.reel{display:inline-block;height:1.15em;overflow:hidden;vertical-align:bottom}
.reel > span{display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.reel > span > span{height:1.15em}

/* Segmented Control Tabs (Task 81 D) */
.tabs-wrap{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--ground);flex:none}
.tabs{display:flex;gap:6px;padding:4px;border:1px solid var(--line-2);border-radius:10px;background:var(--inset);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-height:36px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);padding:0 12px;font-size:12.5px;font-weight:600;color:var(--ink-muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .14s,border-color .14s}
.tab:hover{border-color:var(--accent-edge);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--wash);border-color:var(--accent-edge);color:var(--ink);font-weight:700}
.cnt{font-size:10.5px;padding:1px 6px;border-radius:99px;background:var(--panel);border:1px solid var(--accent-edge);color:var(--accent-ink)}

/* Frame 1: Categories manager (2-pane on PC, stacked on phone, distinct cards & spacing) */
.cat-body{display:grid;grid-template-columns:360px 1fr;flex:1;min-height:0;overflow:hidden}
.cat-left{border-right:1px solid var(--line);background:var(--ground);padding:12px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
.cat-right{background:var(--ground);padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.sec-wrap{display:flex;flex-direction:column;gap:7px}
.sec-lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-dim);padding:0 2px}
.card{border:1px solid var(--line);border-radius:11px;background:var(--panel);overflow:hidden}
.card.pad{padding:13px 15px;display:flex;flex-direction:column;gap:10px}
.grp-toggle{width:100%;min-height:40px;padding:8px 12px;border:0;border-bottom:1px solid transparent;background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--ink);text-align:left}
.grp-toggle:hover{background:var(--sel)}
.grp-toggle[aria-expanded="true"]{background:var(--inset);border-bottom-color:var(--line)}
.grp-toggle .chev{display:inline-flex;align-items:center;gap:6px}
.grp-toggle .chev svg{transition:transform .16s ease}
.grp-toggle[aria-expanded="true"] .chev svg{transform:rotate(90deg)}
.cat-row{width:100%;min-height:50px;border:0;border-bottom:1px solid var(--hair);background:transparent;padding:10px 12px;text-align:left;display:flex;align-items:center;gap:8px;border-left:3px solid transparent;transition:background .1s}
.cat-row:last-child{border-bottom:0}
.cat-row:hover{background:var(--sel)}
.cat-row.sel{background:var(--wash);border-left-color:var(--gold)}
.cat-row .nm{flex:1;min-width:0}
.cat-row b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-row .meta{font-size:11px;color:var(--ink-dim);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.sub-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.sub-row:last-child{border-bottom:0}
.sub-row b{font-size:13px}
.inline-add{display:flex;gap:8px;padding:11px 13px;background:var(--raised);border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.inline-add .inp{flex:1 1 180px}
.warn{padding:9px 11px;border:1px solid var(--accent-edge);border-left:3px solid var(--accent-edge);background:var(--sel);border-radius:8px;font-size:11.5px;color:var(--ink);margin:0 13px 11px}
.warn b{color:var(--accent-ink)}
.warn.err{border-color:var(--danger-ink);border-left-color:var(--danger-ink);background:color-mix(in srgb,var(--danger-ink) 10%,transparent)}
.warn.err b{color:var(--danger-ink)}

/* Frame 2: Master Vault Product Form */
.pf-wrap{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.pf-card{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.pf-card h2{margin:0;font-size:16px;font-weight:700;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.pf-col{display:flex;flex-direction:column;gap:12px}
.pf-lbl{display:block;font-size:11.5px;font-weight:600;color:var(--ink-muted);margin-bottom:4px}
.pf-head{margin:4px 0 0;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);padding-bottom:5px;border-bottom:1px solid var(--hair)}
.pf-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sub-inline-box{padding:11px;border:1px solid var(--accent-edge);border-radius:9px;background:var(--raised);display:flex;flex-direction:column;gap:8px}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.face{height:44px;border:1px dashed var(--line-2);border-radius:7px;background:var(--inset);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-dim);text-transform:capitalize}

/* Frame 3: Preview: terminal tabs (2 single-line scrollable rows, never wraps to 3 lines) */
.st-wrap{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:14px 16px;min-height:0}
.preview-banner{padding:9px 12px;border:1px solid var(--accent-edge);border-radius:9px;background:var(--sel);font-size:12px;color:var(--ink);display:flex;align-items:center;gap:8px}
.st-rows{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;flex:none}
.st-row1-wrap{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--hair)}
.st-strip{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.st-strip::-webkit-scrollbar{display:none}
.st-pill{flex:0 0 auto;white-space:nowrap;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--ground);color:var(--ink-muted);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px}
.st-pill:hover{color:var(--ink);border-color:var(--accent-edge)}
.st-pill.on{border-color:var(--accent-edge);background:var(--wash);color:var(--ink)}
.st-row2-wrap{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--inset)}
.st-row2-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-dim);white-space:nowrap;flex:none}
.st-sub{flex:0 0 auto;white-space:nowrap;height:32px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-muted);font-size:12px;font-weight:600}
.st-sub.on{border-color:var(--accent-edge);background:var(--wash);color:var(--ink);font-weight:700}
.st-search{width:220px;flex:none}
.wares{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:start}
.ware{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:13px;display:flex;flex-direction:column;gap:6px}
.ware b{font-size:13.5px}
.ware .pr{font-size:16px;font-weight:700;color:var(--accent-ink);margin-top:2px}
.ware .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:4px;padding-top:7px;border-top:1px solid var(--hair);font-size:11px;color:var(--ink-dim)}

/* Blurred Modal & Picker Popover (Task 81 E) */
.ov{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:30}
.ov.pop{z-index:40}
.dlg{width:min(460px,100%);max-height:90%;overflow-y:auto;background:var(--raised);border:1px solid var(--line-2);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
.dlg h4{margin:0;font-size:15px}
.dlg p{margin:0;font-size:12px;color:var(--ink-muted);line-height:1.45}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}

/* Self-drawing gold check toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;background:var(--raised);border:1px solid var(--accent-edge);border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.6);transition:opacity .2s,transform .25s cubic-bezier(.2,.7,.2,1);z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:18px;height:18px;flex:none;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.toast path{stroke-dasharray:24;stroke-dashoffset:24}
.toast.on path{animation:draw .45s .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* Phone frame overrides (390px, 44px touch buttons, zero horizontal overflow) */
.sb{height:24px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:11px;color:var(--ink-dim);background:var(--panel);flex:none}
.phone .top{padding:8px 12px;gap:8px}
.phone .top .sub{display:none}
.phone .btn,.phone .btn.xs,.phone .tab,.phone .pick-btn,.phone .grp-toggle,.phone .pop-opt,.phone .st-pill,.phone .st-sub{min-height:44px}
.phone .kpi{grid-template-columns:1fr 1fr}
.phone .kpi > div{padding:7px 10px;border-bottom:1px solid var(--line)}
.phone .kpi > div:nth-child(2n){border-right:0}
.phone .kpi > div:nth-child(n+3){border-bottom:0}
.phone .kpi i{display:block;margin:1px 0 0;font-size:10px}
.phone .tabs-wrap{padding:8px 10px}
.phone .tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;overflow:visible}
.phone .tab{font-size:12px;padding:0 8px;gap:5px}
.phone .tab:nth-child(3){grid-column:span 2}
.phone .cat-body{grid-template-columns:1fr}
.phone .cat-left{border-right:0;padding:10px}
.phone .cat-right{padding:12px}
.phone .pf-wrap{padding:12px}
.phone .pf-card{padding:14px}
.phone .pf-grid{grid-template-columns:1fr;gap:14px}
.phone .pf-2,.phone .pf-3{grid-template-columns:1fr 1fr}
.phone .st-wrap{padding:10px}
.phone .st-row1-wrap{flex-direction:column;align-items:stretch;gap:8px;padding:8px 10px}
.phone .st-row2-wrap{padding:7px 10px}
.phone .st-search{width:100%}
.phone .wares{grid-template-columns:1fr}
.ph-back{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--inset);border-bottom:1px solid var(--line);flex:none}
@media (max-width:760px){.fr.pc,.pcap{display:none}}
.nomotion *,.nomotion *::before,.nomotion *::after{animation:none!important;transition:none!important}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="edit" viewBox="0 0 24 24"><path d="M14 4l6 6-10 10H4v-6z"/></symbol>
  <symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></symbol>
  <symbol id="chk" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>

      { id: 'mild', name: 'Mild', subs: [{ id: 'mild-16', name: 'Mild 16' }, { id: 'mild-menthol', name: 'Mild Menthol' }], rivals: 2 },

      { id: 'c2', name: 'Cello Chocolate (example)', desc: 'Rich chocolate aroma SKM', catId: 'skm', subId: 'skm-flav', stock: 2900, minStock: 600, p1: 10, p2: 20, p3: 4, cost: 8500, retail: 10000, grosir: 9500, ecer: 11000 },
      { id: 'c3', name: 'Cello Mmrapi (example)', desc: 'Smooth mild 16', catId: 'mild', subId: 'mild-16', stock: 3100, minStock: 600, p1: 10, p2: 20, p3: 4, cost: 7100, retail: 8500, grosir: 8000, ecer: 9500 },
      { id: 'c4', name: 'Cello Green (example)', desc: 'Menthol mild blend', catId: 'mild', subId: 'mild-menthol', stock: 480, minStock: 600, p1: 10, p2: 20, p3: 4, cost: 5800, retail: 7000, grosir: 6500, ecer: 8000 },
      { id: 'c5', name: 'Cello Teh Manis (example)', desc: 'Hand-rolled SKT 12', catId: 'skt', subId: 'skt-12', stock: 1850, minStock: 600, p1: 10, p2: 20, p3: 4, cost: 6700, retail: 8000, grosir: 7500, ecer: 9000 },
      { id: 'c6', name: 'Cello Nusantara 12 (example)', desc: 'Classic clove kretek', catId: 'kretek', subId: 'kretek-12', stock: 1100, minStock: 400, p1: 10, p2: 20, p3: 4, cost: 6400, retail: 7500, grosir: 7100, ecer: 8500 },
    ],
  },
};

const G = { co: 'milk', motion: true };
const curCo = () => COMPANIES[G.co];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rp = (n) => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
const normName = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

function findCatMatch(name, skipCatId) {
  const k = normName(name); if (!k) return null;
  for (const c of curCo().cats) {
    if (c.id !== skipCatId && (normName(c.name) === k || normName(c.name).includes(k) || k.includes(normName(c.name)))) {
      return { exact: normName(c.name) === k, label: c.name };
    }
  }
  return null;
}
function findSubMatch(cat, name, skipSubId) {
  const k = normName(name); if (!k || !cat) return null;
  for (const s of cat.subs) {
    if (s.id !== skipSubId && (normName(s.name) === k || normName(s.name).includes(k) || k.includes(normName(s.name)))) {
      return { exact: normName(s.name) === k, label: `${cat.name} › ${s.name}` };
    }
  }
  return null;
}
const catLabel = (catId, subId) => {
  const c = curCo().cats.find((x) => x.id === catId);
  const s = c?.subs.find((x) => x.id === subId);
  return c ? (s ? `${c.name} › ${s.name}` : c.name) : '—';
};
const productsInCat = (catId) => curCo().products.filter((p) => p.catId === catId);
const productsInSub = (subId) => curCo().products.filter((p) => p.subId === subId);

/* ---------- rolling digits + gold check toast ---------- */
function rollHTML(text, prevText) {
  const out = [], pt = prevText || '', off = text.length - pt.length;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (/\d/.test(c)) {
      const old = pt[i - off], from = /\d/.test(old || '') ? +old : 0;
      out.push(`<span class="reel"><span data-to="${c}" style="transform:translateY(-${from * 1.15}em)">${'0123456789'.split('').map((x) => `<span>${x}</span>`).join('')}</span></span>`);
    } else out.push(`<span>${esc(c)}</span>`);
  }
  return `<span class="roll" aria-label="${esc(text)}">${out.join('')}</span>`;
}
function R(st, key, text) { const h = rollHTML(text, st.prev[key]); st.prev[key] = text; return h; }
function settleRolls(root) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.querySelectorAll('.reel > span[data-to]').forEach((s) => { s.style.transform = `translateY(-${+s.dataset.to * 1.15}em)`; });
  }));
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.classList.remove('on'); void t.offsetWidth;
  document.getElementById('toastT').textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2800);
}

/* ---------- dual-mounted state ---------- */
const apps = [];
function initForm(prod) {
  const co = curCo();
  if (prod) return { ...prod };
  const c0 = co.cats[0];
  return { id: '', name: '', desc: '', catId: c0?.id || '', subId: c0?.subs[0]?.id || '', stock: 0, minStock: 30, p1: 10, p2: 6, p3: 4, cost: '', retail: '', grosir: '', ecer: '' };
}
const freshState = (mode) => ({
  mode, tab: 'cats', selCat: curCo().cats[0].id, phDetail: false,
  compCatsOpen: false, // Task 81 H: Competitor-only categories section collapsed by default
  newCatName: '', newSubName: '',
  pfId: curCo().products[0].id, pfForm: initForm(curCo().products[0]), pfInlineSubOpen: false, pfInlineSubName: '',
  stCat: 'ALL', stSub: 'ALL', stQ: '',
  prev: {}, modal: null, modalVal: '', picker: null,
});

function mount(el, mode) {
  const st = freshState(mode);
  apps.push({ el, st });
  el.addEventListener('click', (e) => onClick(e, el, st));
  el.addEventListener('input', (e) => onInput(e, el, st));
  el.addEventListener('change', (e) => onInput(e, el, st));
  render(el, st);
}
function rerenderAll() { apps.forEach((a) => render(a.el, a.st)); }
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    apps.forEach((a) => {
      if (a.st.picker) { a.st.picker = null; render(a.el, a.st); }
      else if (a.st.modal) { a.st.modal = null; render(a.el, a.st); }
    });
  }
});

function render(el, st) {
  const co = curCo(), ph = st.mode === 'phone';
  if (!co.cats.some((c) => c.id === st.selCat)) st.selCat = co.cats[0]?.id || '';
  const activeCat = co.cats.find((c) => c.id === st.selCat) || co.cats[0];
  const ourCats = co.cats.filter((c) => productsInCat(c.id).length > 0);
  const compCats = co.cats.filter((c) => productsInCat(c.id).length === 0);
  const totalSubs = co.cats.reduce((n, c) => n + c.subs.length, 0);
  const lowCount = co.products.filter((p) => Number(p.stock) < Number(p.minStock)).length;

  let html = ph ? `<div class="sb"><span>09:41</span><span>5G · 92%</span></div>` : '';
  html += `<div class="top">
    <b class="t">Master Vault</b>
    <span class="sub">${esc(co.label)} · Main warehouse only · our products</span>
    <span class="sp"></span>
    <button type="button" class="btn q" data-act="open-add-cat"><svg class="i"><use href="#plus"/></svg>${ph ? 'Category' : 'Add category'}</button>
    <button type="button" class="btn" data-act="goto-new-prod"><svg class="i"><use href="#plus"/></svg>${ph ? 'Product' : 'Add product'}</button>
  </div>

  <div class="kpi">
    <div><span class="lbl">Our categories</span><b class="val">${R(st, 'k-c', String(ourCats.length))}</b><i>${totalSubs} sub-categories</i></div>
    <div><span class="lbl">Our products</span><b class="val">${R(st, 'k-p', String(co.products.length))}</b><i>main warehouse only</i></div>
    <div><span class="lbl">Low stock</span><b class="val" style="${lowCount ? 'color:var(--danger-ink)' : ''}">${R(st, 'k-lo', String(lowCount))}</b><i>main warehouse</i></div>
    <div><span class="lbl">Competitor-only</span><b class="val" style="color:var(--accent-ink)">${R(st, 'k-co', String(compCats.length))}</b><i>0 of our products</i></div>
  </div>

  <div class="tabs-wrap">
    <nav class="tabs" role="tablist" aria-label="Master Vault sections">
      <button type="button" class="tab" role="tab" data-tab="cats" aria-selected="${st.tab === 'cats'}"><svg class="i"><use href="#tag"/></svg>Categories <span class="cnt">${ourCats.length}</span></button>
      <button type="button" class="tab" role="tab" data-tab="form" aria-selected="${st.tab === 'form'}"><svg class="i"><use href="#box"/></svg>Product form</button>
      <button type="button" class="tab" role="tab" data-tab="terminal" aria-selected="${st.tab === 'terminal'}"><svg class="i"><use href="#eye"/></svg>Preview: terminal tabs</button>
    </nav>
  </div>`;

  if (st.tab === 'cats') html += renderCatsFrame(co, st, activeCat, ourCats, compCats, ph);
  else if (st.tab === 'form') html += renderProductFormFrame(co, st, ourCats, compCats);
  else html += renderSalesTerminalPreview(co, st, ourCats);

  if (st.modal) html += st.modal(st, co);
  if (st.picker) html += renderPickerPopover(st, co, ourCats, compCats);
  el.innerHTML = html;
  settleRolls(el);
}

/* ---------- Searchable Picker Popover (Product + Category, zero browser blue highlight) ---------- */
function pickerButton({ kind, target, label, sub }) {
  return `<button type="button" class="pick-btn" data-open-picker="${kind}" data-target="${target}">
    <span class="pk-txt"><span class="pk-name">${esc(label)}</span>${sub ? `<span class="pk-sub">${esc(sub)}</span>` : ''}</span>
    <span class="pk-ic"><svg class="i"><use href="#srch"/></svg>Change</span>
  </button>`;
}

function renderPickerPopover(st, co, ourCats, compCats) {
  const pk = st.picker;
  const q = (pk.q || '').trim().toLowerCase();
  const sections = [];
  if (pk.kind === 'product') {
    sections.push({ title: 'Create', items: [{ id: '__new__', name: '+ New product', sub: 'Start a blank Master Vault product', right: '' }] });
    ourCats.forEach((c) => {
      const items = productsInCat(c.id).filter((p) => !q || p.name.toLowerCase().includes(q) || catLabel(p.catId, p.subId).toLowerCase().includes(q));
      if (items.length) sections.push({ title: c.name, items: items.map((p) => ({ id: p.id, name: p.name, sub: `${catLabel(p.catId, p.subId)} · Main WH: ${p.stock} ${co.unit}`, right: rp(p.retail) })) });
    });
  } else if (pk.kind === 'category') {
    // Task 81 H: Our categories first, Competitor-only categories below a divider
    const ourM = ourCats.filter((c) => !q || c.name.toLowerCase().includes(q));
    const compM = compCats.filter((c) => !q || c.name.toLowerCase().includes(q));
    if (ourM.length) sections.push({ title: 'Our categories', items: ourM.map((c) => ({ id: c.id, name: c.name, sub: `${productsInCat(c.id).length} of our products · ${c.subs.length} sub-categories`, right: '' })) });
    if (compM.length) sections.push({ title: 'Competitor-only categories (0 of ours)', items: compM.map((c) => ({ id: c.id, name: c.name, sub: `Made from Competitors · ${c.subs.length} sub-categories`, right: '0 ours' })) });
  }
  return `<div class="ov pop" data-ov="picker"><div class="dlg" role="dialog" aria-label="${esc(pk.title)}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <h4>${esc(pk.title)}</h4>
      <button type="button" class="btn xs q" data-act="close-picker">Close</button>
    </div>
    <label class="search-box">
      <svg class="i"><use href="#srch"/></svg>
      <input data-f="pkQ" id="pkq-${st.mode}" value="${esc(pk.q || '')}" placeholder="Search...">
    </label>
    <div class="pop-list">
      ${sections.length ? sections.map((sec) => `
        <div class="pop-grp">${esc(sec.title)}</div>
        ${sec.items.map((it) => `<button type="button" class="pop-opt ${pk.current === it.id ? 'on' : ''}" data-pick-opt="${esc(it.id)}">
          <div style="min-width:0"><b>${esc(it.name)}</b><span>${esc(it.sub)}</span></div>
          ${it.right ? `<b style="font-size:12px;white-space:nowrap">${esc(it.right)}</b>` : ''}
        </button>`).join('')}
      `).join('') : `<div class="dim" style="padding:18px;text-align:center">Nothing matches "${esc(pk.q)}".</div>`}
    </div>
  </div></div>`;
}

/* ---------- Frame 1: Categories Manager (Our categories + collapsed Competitor-only categories) ---------- */
function renderCatsFrame(co, st, activeCat, ourCats, compCats, ph) {
  const newMatch = findCatMatch(st.newCatName, null);
  const renderCatRow = (c) => {
    const nProd = productsInCat(c.id).length;

        <div class="meta">
          <span>${c.subs.length} sub-categor${c.subs.length === 1 ? 'y' : 'ies'}</span>
          <span>·</span>
          <span>${nProd} of ours</span>
        </div>
      </div>
      ${nProd === 0 ? `<span class="st g">competitors only</span>` : `<span class="st">${nProd} ours</span>`}
    </button>`;
  };

  const left = `<div class="cat-left">
    <div class="sec-wrap">
      <div class="sec-lbl"><span>Our categories (${ourCats.length})</span><span>used by our products</span></div>
      <div class="card">
        ${ourCats.length ? ourCats.map(renderCatRow).join('') : `<div class="sub-row dim">No categories with products yet.</div>`}

          <button type="button" class="btn xs" data-act="add-cat"><svg class="i"><use href="#plus"/></svg>Add</button>
        </div>
        ${newMatch ? `<div class="warn ${newMatch.exact ? 'err' : ''}"><b>${newMatch.exact ? 'Already exists:' : 'Duplicate warning:'}</b> Looks like "${esc(newMatch.label)}". ${newMatch.exact ? 'Exact duplicates are blocked.' : 'Check before adding.'}</div>` : ''}
      </div>
    </div>

    <div class="sec-wrap">
      <div class="sec-lbl"><span>Competitor-only categories</span><span>0 of our products</span></div>
      <div class="card">
        <button type="button" class="grp-toggle" data-act="toggle-comp-cats" aria-expanded="${st.compCatsOpen}">
          <span class="chev"><svg class="i"><use href="#chev"/></svg><span>Competitor-only categories</span></span>
          <span class="st g">${compCats.length}</span>
        </button>
        ${st.compCatsOpen ? (compCats.length
          ? compCats.map(renderCatRow).join('')
          : `<div class="sub-row dim">None in this company yet. Categories created from Competitors with 0 of our products appear here.</div>`) : ''}
      </div>
    </div>
  </div>`;

  let right = '';
  if (activeCat) {
    const prods = productsInCat(activeCat.id);
    const subMatch = findSubMatch(activeCat, st.newSubName, null);
    right = `<div class="cat-right">
      ${ph ? `<div class="ph-back" style="margin:-12px -12px 2px"><button type="button" class="btn xs q" data-act="ph-back"><svg class="i"><use href="#back"/></svg>Categories</button><b style="font-size:13px">${esc(activeCat.name)}</b></div>` : ''}

      <div class="card pad">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div>
            <h2 style="margin:0;font-size:17px">${esc(activeCat.name)}</h2>
            <div class="dim" style="font-size:12px;margin-top:3px">
              ${prods.length} of our products · Main warehouse only
              ${prods.length === 0 ? ` · <span class="st g">competitors only · 0 of ours</span>` : ''}
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn xs q" data-act="open-ren-cat" data-cid="${activeCat.id}"><svg class="i"><use href="#edit"/></svg>Rename</button>
            <button type="button" class="btn xs d" data-act="try-del-cat" data-cid="${activeCat.id}"><svg class="i"><use href="#trash"/></svg>Delete category</button>
          </div>
        </div>
      </div>

      <div class="sec-wrap">
        <div class="sec-lbl"><span>Sub-categories inside ${esc(activeCat.name)} (${activeCat.subs.length})</span><span>one level below category</span></div>
        <div class="card">
          ${activeCat.subs.length ? activeCat.subs.map((s) => {
            const sp = productsInSub(s.id);
            return `<div class="sub-row">
              <div style="flex:1;min-width:140px"><b>${esc(s.name)}</b><div class="dim" style="font-size:11.5px">${sp.length} product${sp.length === 1 ? '' : 's'} using this sub-category</div></div>
              <button type="button" class="btn xs q" data-act="open-ren-sub" data-cid="${activeCat.id}" data-sid="${s.id}"><svg class="i"><use href="#edit"/></svg>Rename</button>
              <button type="button" class="btn xs d" data-act="try-del-sub" data-cid="${activeCat.id}" data-sid="${s.id}"><svg class="i"><use href="#trash"/></svg>Delete</button>
            </div>`;
          }).join('') : `<div class="sub-row dim">No sub-categories under ${esc(activeCat.name)} (top-level category only). Add one below if needed.</div>`}
          <div class="inline-add">
            <input class="inp" data-f="newSubName" id="ns-${st.mode}" value="${esc(st.newSubName)}" placeholder="Add sub-category inside ${esc(activeCat.name)}...">
            <button type="button" class="btn xs" data-act="add-sub" data-cid="${activeCat.id}"><svg class="i"><use href="#plus"/></svg>Add sub-category</button>
          </div>
          ${subMatch ? `<div class="warn ${subMatch.exact ? 'err' : ''}"><b>${subMatch.exact ? 'Already exists:' : 'Duplicate warning:'}</b> Looks like "${esc(subMatch.label)}".</div>` : ''}
        </div>
      </div>

      <div class="sec-wrap">
        <div class="sec-lbl"><span>Our products in ${esc(activeCat.name)} (${prods.length})</span><span>Main warehouse stock · delete blocked while used</span></div>
        <div class="card">
          ${prods.length ? prods.map((p) => `<div class="sub-row">
            <div style="flex:1;min-width:140px"><b>${esc(p.name)}</b><div class="dim" style="font-size:11.5px">${esc(catLabel(p.catId, p.subId))} · Main warehouse: ${p.stock} ${esc(co.unit)}</div></div>

          </div>`).join('') : `<div class="sub-row dim">0 of our products use ${esc(activeCat.name)} — safe to delete, or assign one in Product form.</div>`}
        </div>
      </div>
    </div>`;
  }
  if (ph) return `<div class="cat-body">${st.phDetail ? right : left}</div>`;
  return `<div class="cat-body">${left}${right}</div>`;
}

/* ---------- Events ---------- */
function refocus(el, id) { const i = el.querySelector('#' + id); if (i) { i.focus(); if (i.setSelectionRange) i.setSelectionRange(i.value.length, i.value.length); } }

function onInput(e, el, st) {
  const tg = e.target, f = tg.dataset.f, pf = tg.dataset.pf;
  if (pf) { st.pfForm[pf] = tg.value; return; }
  if (!f) return;
  if (f === 'newCatName') { st.newCatName = tg.value; render(el, st); return refocus(el, `nc-${st.mode}`); }
  if (f === 'newSubName') { st.newSubName = tg.value; render(el, st); return refocus(el, `ns-${st.mode}`); }
  if (f === 'pfInlineSubName') { st.pfInlineSubName = tg.value; render(el, st); return refocus(el, `isub-${st.mode}`); }
  if (f === 'modalVal') { st.modalVal = tg.value; render(el, st); return refocus(el, `mv-${st.mode}`); }
  if (f === 'stQ') { st.stQ = tg.value; render(el, st); return refocus(el, `stq-${st.mode}`); }
  if (f === 'pkQ' && st.picker) { st.picker.q = tg.value; render(el, st); return refocus(el, `pkq-${st.mode}`); }
}

function onClick(e, el, st) {
  const b = e.target.closest('button, [data-open-picker], [data-pick-opt], .ov');
  if (!b) return;
  if (b.classList.contains('ov')) {
    if (e.target === b) {
      if (b.dataset.ov === 'picker') st.picker = null;
      else st.modal = null;
      render(el, st);
    }
    return;
  }
  const d = b.dataset, co = curCo();

  if (d.openPicker) {
    const title = d.openPicker === 'product' ? 'Pick product to edit' : 'Pick category';
    const current = d.openPicker === 'product' ? (st.pfForm.id || '__new__') : st.pfForm.catId;
    st.picker = { kind: d.openPicker, target: d.target, title, current, q: '' };
    render(el, st);
    return refocus(el, `pkq-${st.mode}`);
  }
  if (d.pickOpt !== undefined && st.picker) {
    const val = d.pickOpt, pk = st.picker;
    st.picker = null;
    if (pk.target === 'pf-product') {
      const p = val === '__new__' ? null : co.products.find((x) => x.id === val);
      st.pfId = p ? p.id : '';
      st.pfForm = initForm(p);
      st.pfInlineSubOpen = false;
    } else if (pk.target === 'pf-cat') {
      const cat = co.cats.find((c) => c.id === val);
      st.pfForm.catId = val;
      st.pfForm.subId = cat?.subs[0]?.id || '';
      st.pfInlineSubOpen = false;
    }
    return render(el, st);
  }

  if (d.tab) { st.tab = d.tab; return render(el, st); }
  if (d.pickCat) { st.selCat = d.pickCat; st.phDetail = true; return render(el, st); }
  if (d.stCat) { st.stCat = d.stCat; st.stSub = 'ALL'; return render(el, st); }
  if (d.stSub) { st.stSub = d.stSub; return render(el, st); }

  switch (d.act) {
    case 'close-picker': st.picker = null; return render(el, st);
    case 'close': st.modal = null; return render(el, st);
    case 'ph-back': st.phDetail = false; return render(el, st);
    case 'toggle-comp-cats': st.compCatsOpen = !st.compCatsOpen; return render(el, st);
    case 'goto-new-prod':
      st.tab = 'form'; st.pfId = ''; st.pfForm = initForm(null); st.pfInlineSubOpen = false;
      render(el, st); return toast('Ready to add a new product');
    case 'edit-in-form': {
      const p = co.products.find((x) => x.id === d.pid);
      if (!p) return;
      st.tab = 'form'; st.pfId = p.id; st.pfForm = initForm(p); st.pfInlineSubOpen = false;
      render(el, st); return toast(`Editing ${p.name}`);
    }
    case 'open-add-cat': st.modalVal = ''; st.modal = M.addCat(); return render(el, st);
    case 'add-cat':
    case 'confirm-add-cat': {
      const name = (d.act === 'add-cat' ? st.newCatName : st.modalVal).trim();
      if (!name) return toast('Type a category name first');
      const m = findCatMatch(name, null);
      if (m?.exact) return toast(`"${m.label}" already exists`);
      const id = 'cat-' + Date.now();
      co.cats.push({ id, name, subs: [], rivals: 0 });
      st.selCat = id; st.compCatsOpen = true; st.newCatName = ''; st.modalVal = ''; st.modal = null;
      rerenderAll(); return toast(`Category "${name}" added`);
    }
    case 'open-ren-cat': {
      const cat = co.cats.find((c) => c.id === d.cid);
      if (!cat) return;
      st.modalVal = cat.name; st.modal = M.renCat(cat); return render(el, st);
    }
    case 'confirm-ren-cat': {
      const cat = co.cats.find((c) => c.id === d.cid);
      const name = st.modalVal.trim();
      if (!cat || !name) return toast('Type a category name');
      const m = findCatMatch(name, cat.id);
      if (m?.exact) return toast(`"${m.label}" already exists`);
      const old = cat.name; cat.name = name; st.modal = null;
      rerenderAll(); return toast(`Renamed "${old}" to "${name}"`);
    }
    case 'try-del-cat': {
      const cat = co.cats.find((c) => c.id === d.cid);
      if (!cat) return;
      const used = productsInCat(cat.id);
      if (used.length > 0) {
        st.modal = M.delBlocked('category', cat.name, used);
        render(el, st);
        return toast(`Cannot delete: ${used.length} product${used.length === 1 ? '' : 's'} use ${cat.name}`);
      }
      st.modal = M.delConfirm('category', cat.name, cat.id, null);
      return render(el, st);
    }
    case 'confirm-del-cat': {
      const idx = co.cats.findIndex((c) => c.id === d.cid);
      if (idx < 0) return;
      const name = co.cats[idx].name;
      co.cats.splice(idx, 1);
      st.selCat = co.cats[0]?.id || ''; st.phDetail = false; st.modal = null;
      rerenderAll(); return toast(`Deleted category "${name}"`);
    }
    case 'add-sub': {
      const cat = co.cats.find((c) => c.id === d.cid);
      const name = st.newSubName.trim();
      if (!cat || !name) return toast('Type a sub-category name first');
      const m = findSubMatch(cat, name, null);
      if (m?.exact) return toast(`"${m.label}" already exists`);
      cat.subs.push({ id: 'sub-' + Date.now(), name });
      st.newSubName = '';
      rerenderAll(); return toast(`Sub-category "${cat.name} › ${name}" added`);
    }
    case 'open-ren-sub': {
      const cat = co.cats.find((c) => c.id === d.cid);
      const sub = cat?.subs.find((s) => s.id === d.sid);
      if (!cat || !sub) return;
      st.modalVal = sub.name; st.modal = M.renSub(cat, sub); return render(el, st);
    }
    case 'confirm-ren-sub': {
      const cat = co.cats.find((c) => c.id === d.cid);
      const sub = cat?.subs.find((s) => s.id === d.sid);
      const name = st.modalVal.trim();
      if (!cat || !sub || !name) return toast('Type a sub-category name');
      const m = findSubMatch(cat, name, sub.id);
      if (m?.exact) return toast(`"${m.label}" already exists`);
      const old = sub.name; sub.name = name; st.modal = null;
      rerenderAll(); return toast(`Renamed "${old}" to "${name}"`);
    }
    case 'try-del-sub': {
      const cat = co.cats.find((c) => c.id === d.cid);
      const sub = cat?.subs.find((s) => s.id === d.sid);
      if (!cat || !sub) return;
      const used = productsInSub(sub.id);
      if (used.length > 0) {
        st.modal = M.delBlocked('sub-category', `${cat.name} › ${sub.name}`, used);
        render(el, st);
        return toast(`Cannot delete: ${used.length} product${used.length === 1 ? '' : 's'} use ${sub.name}`);
      }
      st.modal = M.delConfirm('sub-category', `${cat.name} › ${sub.name}`, cat.id, sub.id);
      return render(el, st);
    }
    case 'confirm-del-sub': {
      const cat = co.cats.find((c) => c.id === d.cid);
      if (!cat) return;
      const idx = cat.subs.findIndex((s) => s.id === d.sid);
      if (idx < 0) return;
      const name = cat.subs[idx].name;
      cat.subs.splice(idx, 1);
      st.modal = null;
      rerenderAll(); return toast(`Deleted sub-category "${name}"`);
    }
    case 'toggle-inline-sub':
      st.pfInlineSubOpen = !st.pfInlineSubOpen; st.pfInlineSubName = '';
      render(el, st);
      if (st.pfInlineSubOpen) refocus(el, `isub-${st.mode}`);
      return;
    case 'save-inline-sub': {
      const cat = co.cats.find((c) => c.id === st.pfForm.catId);
      const name = st.pfInlineSubName.trim();
      if (!cat || !name) return toast('Type the new sub-category name first');
      const m = findSubMatch(cat, name, null);
      if (m?.exact) return toast(`"${m.label}" already exists`);
      const id = 'sub-' + Date.now();
      cat.subs.push({ id, name });
      st.pfForm.subId = id; st.pfInlineSubOpen = false; st.pfInlineSubName = '';
      rerenderAll(); return toast(`Added and selected "${cat.name} › ${name}"`);
    }
    case 'save-product': {
      const f = st.pfForm;
      const name = (f.name || '').trim();
      if (!name) return toast('Product name is required');
      if (f.id) {
        const orig = co.products.find((p) => p.id === f.id);
        if (orig) Object.assign(orig, { ...f, name, stock: Number(f.stock) || 0, minStock: Number(f.minStock) || 0, retail: Number(f.retail) || 0, grosir: Number(f.grosir) || 0, ecer: Number(f.ecer) || 0, cost: Number(f.cost) || 0 });
        rerenderAll(); return toast(`Saved "${name}" · ${catLabel(f.catId, f.subId)}`);
      } else {
        const id = 'p-' + Date.now();
        const created = { ...f, id, name, stock: Number(f.stock) || 0, minStock: Number(f.minStock) || 0, retail: Number(f.retail) || 0, grosir: Number(f.grosir) || 0, ecer: Number(f.ecer) || 0, cost: Number(f.cost) || 0 };
        co.products.push(created);
        st.pfId = id; st.pfForm = initForm(created);
        rerenderAll(); return toast(`Added "${name}" to ${catLabel(created.catId, created.subId)}`);
      }
    }
  }
}

/* ---------- Top board controls ---------- */
const segs = (id, fn) => document.getElementById(id).addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  fn(b.dataset.v);
});
segs('company', (v) => {
  G.co = v;
  apps.forEach((a) => {
    const co = curCo();
    a.st.selCat = co.cats[0].id; a.st.phDetail = false; a.st.compCatsOpen = false; a.st.modal = null; a.st.picker = null;
    a.st.pfId = co.products[0].id; a.st.pfForm = initForm(co.products[0]); a.st.pfInlineSubOpen = false;
    a.st.stCat = 'ALL'; a.st.stSub = 'ALL'; a.st.stQ = '';
  });
  rerenderAll();
  toast(`Switched to ${curCo().label}`);
});
segs('theme', (v) => { if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; });
segs('motion', (v) => { G.motion = v === 'on'; document.body.classList.toggle('nomotion', !G.motion); });

mount(document.getElementById('pc'), 'pc');
mount(document.getElementById('ph'), 'phone');
</script>
