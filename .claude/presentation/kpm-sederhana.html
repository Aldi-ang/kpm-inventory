<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DSM · Presentasi Sederhana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* The calm copy of kpm-semua-terkendali.html, for older viewers (Aldi, 2026-10-27): the same facts in the same
   order, one idea per screen, nothing moves, nothing advances by itself. Every text is 20px or more on a phone.
   Atkinson Hyperlegible was drawn for low-vision readers. Light (paper) and dark, switched by the button in the
   top bar (his call: "both light and dark version inside the ppt to be toggle button"). Palette law: no blue, no
   green, gold never as text on light - in light, gold is only an edge or a lamp. */
:root {
  --page: #EDE7D8; --card: #F7F3EA; --edge: #B9B0A0; --ink: #1A1714; --ink2: #4A443C; --rust: #8F1E18;
  --gold: #D08A2E; --lampR: #B3261E; --lampY: #E4B04A; --btn: #1A1714; --btnInk: #F7F3EA; --mark: #8F1E18;
  color-scheme: light;
}
:root[data-tema="gelap"] {
  --page: #121110; --card: #1B1917; --edge: #4A443C; --ink: #F2EEE4; --ink2: #CFC8BA; --rust: #E4B04A;
  --btn: #F2EEE4; --btnInk: #121110; --mark: #C46A3A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); scroll-behavior: auto; }
body { font: 22px/1.5 "Atkinson Hyperlegible", system-ui, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%;
  padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); border-bottom: 2px solid var(--edge); font-size: 20px; }
header b { letter-spacing: .04em; font-size: 22px; }
#tema { font-size: 20px; font-weight: 700; min-height: 52px; padding: 0 16px; border-radius: 12px; cursor: pointer;
  background: var(--card); border: 2px solid var(--ink); }
#bar { height: 4px; background: var(--edge); }
#bar i { display: block; height: 100%; background: var(--rust); }
main { padding: 24px 16px 8px; max-width: 1240px; margin: 0 auto; }
.kick { color: var(--rust); font-weight: 700; font-size: 20px; margin: 0 0 2px; }
.who { color: var(--ink2); font-size: 20px; margin: 0 0 12px; }
h1 { font-size: 32px; line-height: 1.2; margin: 0 0 16px; text-wrap: balance; }
h1:focus { outline: none; }
.say p { margin: 0 0 14px; }
.pic { margin: 4px 0 18px; }
.ic { padding: 10px 8px; }
.ics .ic svg { width: 40px; height: 40px; }
.shot img { max-height: 44vh; object-fit: cover; object-position: top; }
.demo { color: var(--ink2); font-size: 20px; margin: 10px 0 0; }
/* pictures: icon tiles, arrow flows, real app screens in a phone bezel, charts without numbers */
.ics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.ic { background: var(--card); border: 2px solid var(--edge); border-radius: 14px; padding: 14px 10px; display: grid; justify-items: center;
  align-content: start; gap: 8px; text-align: center; font-size: 20px; font-weight: 700; line-height: 1.3; }
.ic svg, .rl, .stk .lg svg { width: 52px; height: 52px; fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.rl { width: 32px; height: 32px; }
.ic.hot { border-color: var(--gold); border-width: 3px; }
.ic.hot svg { stroke: var(--mark); }
.ic.no { color: var(--ink2); border-style: dashed; }
.ic.no svg { stroke: var(--ink2); }
.flow { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
.flow .ic { grid-template-columns: auto 1fr; justify-items: start; align-items: center; text-align: left; padding: 10px 14px; }
.flow .ic svg { width: 44px; height: 44px; }
.arr { width: 30px; height: 30px; align-self: center; transform: rotate(90deg); fill: none; stroke: var(--mark); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.shot { margin: 0 auto; width: min(290px, 100%); border: 8px solid #0A0908; border-radius: 26px; overflow: hidden; background: #0A0908; outline: 2px solid var(--edge); }
.shot img { display: block; width: 100%; height: auto; }
.shot figcaption { color: #CFC8BA; font-size: 20px; text-align: center; padding: 6px 0 2px; }
.hb { display: grid; gap: 14px; }
.hb i { display: block; height: 16px; margin-top: 6px; border-radius: 8px; background: var(--ink2); }
.hb i.hot { background: var(--mark); }
.chart svg { display: block; width: 100%; height: auto; }
.chart .ax { stroke: var(--edge); stroke-width: 2; fill: none; }
.chart .tg { stroke: var(--ink2); stroke-width: 3; stroke-dasharray: 8 7; fill: none; }
.chart .act { stroke: var(--mark); stroke-width: 5; fill: none; }
.chart circle.act { fill: var(--mark); }
.chart .now { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 3 5; fill: none; }
.chart .zone { fill: var(--page); stroke: var(--ink2); stroke-width: 3; stroke-dasharray: 9 7; }
.chart .r { stroke: var(--ink2); stroke-width: 2; }
.chart .pin path, .chart .pin circle, .chart .pin rect { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.chart .pin.ok path, .chart .pin.ok circle { stroke: var(--mark); stroke-width: 2.4; }
.chart .pin.bad path, .chart .pin.bad circle { stroke: var(--ink2); }
.lg { display: grid; gap: 6px; margin-top: 10px; font-size: 20px; }
.lg span { display: flex; align-items: center; gap: 10px; }
.lg i { flex: none; width: 28px; height: 0; border-top: 4px solid var(--ink2); }
.lg i.tg { border-top-style: dashed; } .lg i.act, .lg i.ok { border-color: var(--mark); border-top-width: 5px; }
.lg i.now { border-top: 2px dashed var(--ink); } .lg i.zone { border-top-style: dashed; } .lg i.bad { border-top-style: dotted; }
.lg i.min { border-top: 3px dashed var(--ink); }
.stk .cols { position: relative; height: 190px; display: flex; align-items: flex-end; gap: 10px; border-bottom: 2px solid var(--edge); }
.stk .cols i { flex: 1; background: var(--ink2); border-radius: 6px 6px 0 0; }
.stk .cols i.hot { background: var(--mark); }
.stk .cols b { position: absolute; left: 0; right: 0; border-top: 3px dashed var(--ink); }
.stk .mo { display: flex; gap: 10px; font-size: 20px; } .stk .mo span { flex: 1; text-align: center; }
.stk .lg svg { width: 28px; height: 28px; }
.card { background: var(--card); border: 2px solid var(--edge); border-radius: 14px; padding: 12px 16px; }
.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.row > div { min-width: 0; }
.row b { display: block; }
.row span { display: block; color: var(--ink2); }
.row.on { border-color: var(--gold); border-width: 3px; }
.lamp { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--ink); }
.lamp.r { background: var(--lampR); } .lamp.y { background: var(--lampY); } .lamp.o { background: transparent; border-color: var(--edge); }
.dot { width: 14px; height: 14px; background: var(--rust); border-radius: 3px; }
.tier { min-width: 64px; text-align: center; font-weight: 700; border: 2px solid var(--ink); border-radius: 10px; padding: 4px 6px; }
.num { font-weight: 700; font-variant-numeric: tabular-nums; }
.row.in > div > b, .row.in > div > span { display: inline; }
.row.in > div > span::before { content: ' · '; }
.bar { display: block; height: 4px; background: var(--edge); border-radius: 2px; margin-top: 8px; }   /* a line whose length is the data: amber never fills */
.bar i { display: block; height: 100%; background: var(--rust); border-radius: 2px; }
.tab { display: grid; grid-template-columns: auto 1fr auto auto; gap: 4px 12px; align-items: baseline; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tab b { color: var(--ink2); }
.tab .r { text-align: right; }
.tab span:not(.bar) { font-weight: 700; padding-left: 2px; }
.tab .bar { grid-column: 1 / -1; margin: 0 0 8px; }
.nota { font-variant-numeric: tabular-nums; }
.nota div { display: flex; justify-content: space-between; gap: 12px; }
.nota .hd { font-weight: 700; border-bottom: 2px dashed var(--edge); padding-bottom: 6px; margin-bottom: 6px; display: block; }
.nota .tot { font-weight: 700; border-top: 2px dashed var(--edge); padding-top: 6px; margin-top: 6px; }
.big3 { display: grid; gap: 10px; }
.big3 .card b { display: block; font-size: 36px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.big3 .card span { color: var(--ink2); }
.cover { text-align: center; padding-top: 8px; }
.cover img { width: 168px; height: 168px; }
.cover .big { font-size: 72px; font-weight: 700; letter-spacing: .08em; line-height: 1; margin: 4px 0 6px; }
.cover .sub { font-weight: 700; letter-spacing: .06em; margin: 0 0 18px; }
.cover .lead { max-width: 30ch; margin: 0 auto 18px; }
.cover .how { color: var(--ink2); max-width: 30ch; margin: 0 auto; }
nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--page); border-top: 2px solid var(--edge); }
nav button { font-size: 22px; font-weight: 700; min-height: 72px; border-radius: 14px; cursor: pointer; white-space: nowrap; }
#back { flex: 1; background: var(--card); color: var(--ink); border: 2px solid var(--ink); }
#next { flex: 1.6; background: var(--btn); color: var(--btnInk); border: 0; border-bottom: 5px solid var(--gold); }
#back[hidden] { display: none; }
@media (min-width: 900px) {
  body { font-size: 28px; padding-bottom: 128px; }
  header { padding: 14px 40px; font-size: 22px; }
  main { padding: 40px 40px 16px; min-height: calc(100vh - 210px); display: flex; align-items: center; }
  main > div { width: 100%; }
  .kick, .who, .demo { font-size: 22px; }
  h1 { font-size: 52px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "hd pic" "tx pic"; column-gap: 56px; align-items: center; }
  .two .hd { grid-area: hd; align-self: end; } .two .tx { grid-area: tx; align-self: start; }
  .two .pic { grid-area: pic; margin: 0; }
  .say { max-width: 32ch; }
  .ics .ic svg { width: 56px; height: 56px; }
  .ic { padding: 16px 10px; }
  .card { padding: 16px 24px; }
  .row, .nota { font-size: 26px; }
  .big3 { grid-template-columns: 1fr 1fr; }
  .big3 .card b { font-size: 40px; white-space: nowrap; }
  .cover img { width: 160px; height: 160px; }
  .cover .big { font-size: 96px; }
  .tab { font-size: 26px; }
  .ic, .lg, .stk .mo { font-size: 22px; }
  .ic svg { width: 64px; height: 64px; }
  .flow { flex-direction: row; align-items: center; }
  .flow .ic { flex: 1 1 0; grid-template-columns: none; justify-items: center; text-align: center; padding: 16px 10px; }
  .flow .ic svg { width: 56px; height: 56px; }
  .arr { transform: none; flex: none; }
  .shot { width: 300px; }
  .shot img { max-height: calc(100vh - 330px); object-fit: cover; object-position: top; }
  nav { justify-content: center; padding: 16px 40px; }
  nav button { min-height: 80px; font-size: 26px; }
  #back { flex: 0 1 280px; } #next { flex: 0 1 480px; }
}
</style>
</head>
<body>
<header><b>DSM</b><button id="tema" type="button"></button></header>
<div id="bar"><i></i></div>
<main id="main"></main>
<nav><button id="back" type="button">‹ Kembali</button><button id="next" type="button">Lanjut ›</button></nav>

        <p class="lead">Semua yang tadi Anda lihat ada di dalam satu aplikasi: DSM.</p></div>`;
  } else {
    const same = S.filter((x) => x.f === s.f), part = same.indexOf(s) + 1;
    const kick = s.f === LAST ? `Penutup · ${FEAT[s.f - 1]}` : `Fitur ${s.f} dari ${LAST - 1} · ${FEAT[s.f - 1]}`;
    const who = WHO[s.w] + (same.length > 1 ? ` · bagian ${part} dari ${same.length}` : '');
    /* phone: title, then the picture, then the words - the picture is the first thing read; PC: words left, picture right */
    $('#main').innerHTML = `<div class="two"><div class="say hd"><p class="kick">${kick}</p><p class="who">${who}</p><h1 tabindex="-1">${s.t}</h1></div>
      <div class="pic">${s.pic}</div><div class="say tx">${s.p.map((x) => `<p>${x}</p>`).join('')}</div></div>`;
  }
  $('#bar i').style.width = (s.cover ? 0 : s.end ? 100 : (s.f / LAST) * 100) + '%';
  $('#back').hidden = i === 0;
  $('#next').dataset.label = i === 0 ? 'Mulai ›' : s.end ? 'Kembali ke awal' : 'Lanjut ›';
  scrollTo(0, 0); $('h1').focus({ preventScroll: true }); label();
}
/* A screen taller than the phone: the big button first shows the rest of it, so pressing it again and again
   never skips anything. */
const below = () => innerHeight - $('nav').offsetHeight < $('#main').getBoundingClientRect().bottom - 4;
const label = () => { $('#next').textContent = below() ? 'Lanjut ke bawah ↓' : $('#next').dataset.label; };
addEventListener('scroll', label, { passive: true });
addEventListener('resize', label);
const go = (d) => { const i = idx() + d; location.hash = d > 0 && i >= S.length ? '0' : String(Math.max(0, i)); };
$('#next').onclick = () => { if (below()) scrollBy(0, innerHeight - $('nav').offsetHeight - 80); else go(1); };
$('#back').onclick = () => go(-1);
addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
addEventListener('hashchange', render);
/* light or dark: the button names the look it switches TO; the choice is kept on this phone only */
function setTema(t) {
  document.documentElement.dataset.tema = t;
  $('#tema').textContent = t === 'gelap' ? 'Layar terang' : 'Layar gelap';
  try { localStorage.setItem('dsm-tema', t); } catch {}
}
let saved = 'terang'; try { saved = localStorage.getItem('dsm-tema') || saved; } catch {}
setTema(new URLSearchParams(location.search).get('tema') || saved);
$('#tema').onclick = () => setTema(document.documentElement.dataset.tema === 'gelap' ? 'terang' : 'gelap');
render();
</script>
</body>
