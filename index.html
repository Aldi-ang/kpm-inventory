<!doctype html>
<!-- kpm-cursor turns on the app's own reticle pointer. It is a class rather than a bare
     html rule so it can be dropped in one place if it ever gets in the way, and so the
     stylesheet stays inert until something opts in. See "THE POINTER" in theme.css. -->
<html lang="en" class="kpm-cursor">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- His report: "sometimes i drag something and the whole app zoom and moved". This is a
         field tool held in one hand next to a road, not a document to read, so the page itself
         must not pan or zoom. `viewport-fit=cover` lets it fill an iPhone's rounded screen.
         iOS Safari ignores user-scalable=no on its own — the gesture guard in main.jsx is what
         actually stops pinch there, and it deliberately leaves the MAP alone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>KPM Inventory by AK</title>

    <meta name="theme-color" content="#1a1815" />

    <!-- ⚠️ THE THEME IS STAMPED BEFORE THE FIRST PAINT, AND IT HAS TO BE HERE TO DO THAT.
         React sets the same classes, but only after mount — so a user whose saved theme is
         light would watch the app load DARK and then flip, on every single launch. This runs
         before the stylesheet is even parsed, so there is nothing to flip.
         ⚠️ THE STORAGE KEY AND THE SAVED STRING BELOW MUST MATCH App.jsx's theme effect exactly.
         If they drift, this stamps one theme and React immediately corrects it to the other,
         which is the same flash this exists to remove — and it would only show on the theme
         the author was not looking at. A check holds the two together. -->
    <script>
      (function () {
        try {
          var light = localStorage.getItem('kpm_theme') === 'light';
          document.documentElement.classList.add(light ? 'light' : 'dark');
          if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#B4B0A9');
        } catch (e) { /* private mode blocks localStorage; dark is the default anyway */ }
      })();
    </script>

    <!-- Stops the rubber-band bounce and pull-to-refresh that make the app feel like it slid
         off the screen. Scrolling INSIDE the app is untouched — this only pins the document. -->
    <style>
      html, body { overscroll-behavior: none; }
      body { position: relative; overflow-x: hidden; }

      /* THE NAVIGATION PANEL DOES NOT GET TO FLASH. His report: "sometimes there is a bug and
         the sidepanel show a while until i refresh on the phone then its gone".

         The app imports its stylesheet from main.jsx, so the dev server injects that CSS with
         JavaScript AFTER React has painted. In that window the panel has no `fixed`, no
         `translate-x-full` and no width — it is a plain block in the middle of the document,
         in full view, until the styles land. This <style> is in the document before any of
         that, so it wins the race; theme.css turns it back on when the real styles arrive.

         Scoped to this ONE element deliberately. The usual version of this guard hides #root
         until styled, which blanks the entire app if the stylesheet ever fails to load. */
      [data-kpm-rail] { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
