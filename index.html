<!doctype html>
<!-- kpm-cursor turns on the app's own reticle pointer. It is a class rather than a bare
     html rule so it can be dropped in one place if it ever gets in the way, and so the
     stylesheet stays inert until something opts in. See "THE POINTER" in theme.css. -->
<html lang="en" class="kpm-cursor">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- His report: "sometimes i drag something and the whole app zoom and moved". This is a
         field tool held in one hand next to a road, not a document to read, so the page itself
         must not pan or zoom. `viewport-fit=cover` lets it fill an iPhone's rounded screen.
         iOS Safari ignores user-scalable=no on its own — the gesture guard in main.jsx is what
         actually stops pinch there, and it deliberately leaves the MAP alone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>KPM Inventory by AK</title>

    <meta name="theme-color" content="#1a1815" />

    <!-- Stops the rubber-band bounce and pull-to-refresh that make the app feel like it slid
         off the screen. Scrolling INSIDE the app is untouched — this only pins the document. -->
    <style>
      html, body { overscroll-behavior: none; }
      body { position: relative; overflow-x: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
