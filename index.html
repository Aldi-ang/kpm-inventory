<!doctype html>
<!-- kpm-cursor turns on the app's own reticle pointer. It is a class rather than a bare
     html rule so it can be dropped in one place if it ever gets in the way, and so the
     stylesheet stays inert until something opts in. See "THE POINTER" in theme.css. -->
<html lang="en" class="kpm-cursor">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KPM Inventory by AK</title>

    <meta name="theme-color" content="#1a1815" />
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
