<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .intro {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 1s ease-out;
            pointer-events: none;
            z-index: 10;
        }

        .intro.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro h1 {
            font-size: 80px;
            color: white;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .coin-container {
            perspective: 1000px;
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 100px;
        }

        .coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: spinCoin 2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        @keyframes spinCoin {
            0% {
                transform: rotateY(0deg) translateY(0);
            }
            50% {
                transform: rotateY(1080deg) translateY(-200px);
            }
            100% {
                transform: rotateY(1080deg) translateY(0);
            }
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 50%;
            border: 8px solid #b8860b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            font-weight: bold;
            color: #8b4513;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            background: #d4af37;
        }

        .heads {
            transform: rotateY(0deg);
        }

        .tails {
            transform: rotateY(180deg);
        }

        .coin-edge {
            position: absolute;
            width: 100%;
            height: 12px;
            background: #b8860b;
            top: 50%;
            left: 0;
            border-radius: 6px;
            transform: translateY(-50%) rotateX(90deg);
        }

        .shadow {
            position: absolute;
            width: 180px;
            height: 40px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            top: 120%;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(10px);
            animation: shadowFade 2s forwards;
        }

        @keyframes shadowFade {
            0% {
                opacity: 0.5;
                transform: translateX(-50%) scaleY(1);
            }
            50% {
                opacity: 0.1;
                transform: translateX(-50%) scaleY(0.3);
            }
            100% {
                opacity: 0.5;
                transform: translateX(-50%) scaleY(1);
            }
        }

        .result {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            padding: 20px 40px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            opacity: 0;
            animation: resultFadeIn 1s ease-in forwards;
            animation-delay: 2.5s;
        }

        @keyframes resultFadeIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .outro {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease-in;
            pointer-events: none;
            z-index: 20;
        }

        .outro.show {
            opacity: 1;
        }

        .outro h2 {
            font-size: 40px;
            color: white;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .spin-counter {
            position: absolute;
            top: 50px;
            right: 50px;
            font-size: 24px;
            color: white;
            opacity: 0.7;
            font-family: monospace;
        }

        button {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            font-size: 18px;
            background: #d4af37;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: #8b4513;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 15;
        }

        button:hover {
            background: #e6c344;
            transform: translateX(-50%) translateY(-2px);
        }

        button:active {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="intro" id="intro">
            <h1>Coin Flip Animation</h1>
        </div>

        <div class="spin-counter" id="spinCounter">Spin: 3.0 rotations</div>

        <div class="coin-container">
            <div class="coin" id="coin">
                <div class="coin-face heads">H</div>
                <div class="coin-face tails">T</div>
                <div class="coin-edge"></div>
            </div>
            <div class="shadow"></div>
        </div>

        <div class="result" id="result"></div>
        <div class="outro" id="outro">
            <h2>Made with Remotion (& 9Router Delegation)</h2>
        </div>

        <button onclick="flipCoin()">Flip Again</button>
    </div>

    <script>
        let isAnimating = false;

        function flipCoin() {
            if (isAnimating) return;
            isAnimating = true;

            const intro = document.getElementById('intro');
            const coin = document.getElementById('coin');
            const result = document.getElementById('result');
            const outro = document.getElementById('outro');
            const button = document.querySelector('button');

            // Reset
            intro.classList.remove('hidden');
            result.textContent = '';
            result.style.opacity = '0';
            outro.classList.remove('show');
            button.disabled = true;

            // Show intro
            setTimeout(() => {
                intro.classList.add('hidden');
            }, 1000);

            // Random result
            const isHeads = Math.random() > 0.5;
            const resultText = isHeads ? 'HEADS!' : 'TAILS!';

            // Animate coin
            coin.style.animation = 'none';
            setTimeout(() => {
                coin.style.animation = 'spinCoin 2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards';
            }, 50);

            // Show result
            setTimeout(() => {
                result.textContent = resultText;
                result.style.opacity = '1';
            }, 2500);

            // Show outro
            setTimeout(() => {
                outro.classList.add('show');
            }, 4000);

            // Re-enable button
            setTimeout(() => {
                isAnimating = false;
                button.disabled = false;
            }, 5000);
        }

        // Auto-play on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                flipCoin();
            }, 500);
        });
    </script>
</body>
</html>
